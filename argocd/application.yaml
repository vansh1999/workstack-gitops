apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: workstack
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://github.com/vansh1999/workstack.git
      targetRevision: main
      path: helm/workstack
      helm:
        valueFiles:
          - values-gke.yaml
          - $values/environments/gke/image-tags.yaml
    - repoURL: https://github.com/vansh1999/workstack-gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: workstack
  syncPolicy:
    automated:
      prune: true
      selfHeal: false
    syncOptions:
      - CreateNamespace=false
  ignoreDifferences:
    # GKE's NEG controller rewrites this annotation into its canonical form
    # after processing it, so the live value never matches what's declared —
    # not real drift, just how container-native load balancing reports back.
    - group: ""
      kind: Service
      name: frontend
      namespace: workstack
      jsonPointers:
        - /metadata/annotations/cloud.google.com~1neg
    # The backend HPA (min 1/max 3) owns replica count at runtime; the chart
    # declares 1 as the baseline. Without this, every HPA scale event shows
    # as OutOfSync noise even though nothing is actually misconfigured.
    - group: apps
      kind: Deployment
      name: backend
      namespace: workstack
      jsonPointers:
        - /spec/replicas
